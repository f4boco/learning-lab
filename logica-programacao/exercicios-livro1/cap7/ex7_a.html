<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Exercício 7.A</title>
</head>
<body>

    <section class="entradas">
        <img src="imagens/natacao.avif" alt="Desenho Nadador" class="alta">
        <h1>Clube de Natação</h1>
        <form id="formulario-cadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Nome Completo" required autofocus>
            <label for="idade"></label>
            <input type="number" id="idade" required min="6" step="1">
            <button type="submit" id="categorizar">Categorizar Atleta</button>
        </form>
    </section>

    <section class="saidas">
        <pre id="resultado">
            </pre>
    </section>

    <script src="js/ex7_a.js"></script>
</body>
</html>
